name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }}, meshfix=${{ matrix.meshfix }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        meshfix: [false]
        include:
          - os: ubuntu-latest
            python: "3.12"
            meshfix: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.meshfix }}" = "true" ]; then
            pip install -e ".[dev,meshfix]"
          else
            pip install -e ".[dev]"
          fi
      - name: Lint
        run: ruff check src tests
      - name: Version check
        run: watertight --version
      - name: Tests
        run: pytest -q

  licenses:
    name: required dependencies have no GPL/AGPL license
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the default (non-optional) dependencies only
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pip-licenses
      - name: Fail on GPL / AGPL
        run: pip-licenses --partial-match --fail-on="GNU" --ignore-packages watertight

  ci-ok:
    name: ci-ok
    if: always()
    needs: [test, licenses]
    runs-on: ubuntu-latest
    steps:
      - name: Every test and license job must have passed
        run: |
          echo "test: ${{ needs.test.result }}, licenses: ${{ needs.licenses.result }}"
          [ "${{ needs.test.result }}" = "success" ] && [ "${{ needs.licenses.result }}" = "success" ]
