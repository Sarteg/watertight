<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="watertight logo">
  <title>watertight</title>
  <rect width="512" height="512" rx="112" fill="#0B1F33"/>
  <!-- low-poly water drop: a closed mesh with no gaps -->
  <g stroke="#0B1F33" stroke-width="5" stroke-linejoin="round">
    <polygon points="256,64 168,228 256,262" fill="#7DD3FC"/>
    <polygon points="256,64 256,262 344,228" fill="#38BDF8"/>
    <polygon points="168,228 128,318 256,262" fill="#38BDF8"/>
    <polygon points="344,228 256,262 384,318" fill="#0EA5E9"/>
    <polygon points="128,318 160,396 256,262" fill="#0EA5E9"/>
    <polygon points="384,318 256,262 352,396" fill="#0284C7"/>
    <polygon points="160,396 256,448 256,262" fill="#0284C7"/>
    <polygon points="352,396 256,262 256,448" fill="#0369A1"/>
  </g>
  <!-- the seal: a check mark across the drop -->
  <path d="M196 300 L244 346 L330 238" fill="none" stroke="#F0F9FF" stroke-width="26"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
